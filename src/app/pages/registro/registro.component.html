<div class="login-page">
	<div class="bg-shape shape-1"></div>
	<div class="bg-shape shape-2"></div>

	<p-card styleClass="login-card">
		<div class="login-header">
			<div class="login-badge">
				<i class="pi pi-shield"></i>
			</div>
			<h2>Iniciar Sesión</h2>
			<p>Ingresa tus credenciales para continuar</p>
		</div>

		<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
			<div class="field">
				<label for="username">Usuario</label>
				<span class="input-wrap">
					<i class="pi pi-user"></i>
					<input 
						id="username"
						type="text" 
						pInputText 
						formControlName="username" 
						placeholder="Ingresa tu usuario"
						class="w-full"
					/>
				</span>
				<small class="error" *ngIf="isSubmitted && lf['username'].errors">Usuario requerido</small>
			</div>

			<div class="field">
				<label for="password">Contraseña</label>
				<span class="input-wrap">
					<i class="pi pi-lock"></i>
					<input 
						id="password"
						type="password" 
						pInputText 
						formControlName="password" 
						placeholder="Ingresa tu contraseña"
						class="w-full"
					/>
				</span>
				<small class="error" *ngIf="isSubmitted && lf['password'].errors">Contraseña requerida</small>
			</div>

			<small class="error error-message" *ngIf="errorMessage">{{ errorMessage }}</small>

			<div class="actions">
				<p-button 
					type="submit" 
					[label]="isLoading ? 'Ingresando...' : 'Ingresar'" 
					[disabled]="isLoading"
					styleClass="w-full login-btn"
				></p-button>
			</div>
		</form>
	</p-card>
</div>
